spring.application.name=movie
spring.profiles.default=h2
booking.hold-duration=5m

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
booking.currency=INR
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Fictional Razorpay-style provider; use a local stub for the assignment.
payment.provider.url=${PAYMENT_PROVIDER_URL:http://localhost:8089}
spring.cloud.openfeign.client.config.razorpay.connectTimeout=2000
spring.cloud.openfeign.client.config.razorpay.readTimeout=5000
spring.cloud.openfeign.client.config.razorpay.loggerLevel=none
payment.outbox.enabled=true
payment.outbox.poll-delay-ms=5000
